<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter CC Extractor</title>
</head>
<body>

    <h1>Twitter/X CC Extractor</h1>

    <input
        type="text"
        id="url"
        placeholder="Paste Twitter/X video URL"
    >

    <button onclick="extractCC()">Extract CC</button>

    <pre id="result"></pre>

    <script>
        async function extractCC() {
            const url = document.getElementById("url").value;
            const result = document.getElementById("result");

            result.textContent = "Processing...";

            try {
                const response = await fetch("YOUR_BACKEND_URL/extract", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                result.textContent = data.message || data.error;
            } catch (error) {
                result.textContent = "Error connecting to backend.";
            }
        }
    </script>

</body>
</html>
